
<!DOCTYPE html>
<html>
<head>
    <title>Update Employee</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Update Employee</h1>

    <form method="POST">
        <label>Employee ID:</label>
        <input type="text" value="{{ emp_id }}" disabled>

        <label>Name:</label>
        <input type="text" name="name"
               value="{{ details[0] }}" required>

        <label>Birthdate:</label>
        <input type="date" name="birthdate"
               value="{{ details[1] }}" required>

        <label>Joining Date:</label>
        <input type="date" name="joining_date"
               value="{{ details[2] }}" required>

        <label>Post / Designation:</label>
        <input type="text" name="post"
               value="{{ details[3] }}">

        <label>Phone Number:</label>
        <input type="tel" name="phone"
               value="{{ details[4] }}">

        <label>Salary:</label>
        <input type="number" name="salary"
               value="{{ details[5] }}" min="0" step="0.01">

        <label>Address:</label>
        <textarea name="address">{{ details[6] }}</textarea>

        <label>Email:</label>
        <input type="email" name="email"
               value="{{ details[7] }}">

        <button type="submit">Save Changes</button>
    </form>

    <p><a href="/">Back to Directory</a></p>

</body>
</html>
